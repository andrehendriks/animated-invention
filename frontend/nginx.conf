server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_connect_timeout 10s;
    proxy_read_timeout 210s;
    proxy_send_timeout 210s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
