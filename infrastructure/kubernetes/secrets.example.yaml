apiVersion: v1
kind: Secret
metadata:
  name: atlas-secrets
  namespace: atlas
type: Opaque
stringData:
  ATLAS_AUTH_ENABLED: "true"
  ATLAS_API_KEY: replace-me
  ATLAS_DOCKER_ENABLED: "false"
  ATLAS_OLLAMA_BASE_URL: http://ollama.atlas.svc.cluster.local:11434
  ATLAS_MONITORING_ENABLED: "true"
  ATLAS_PROMETHEUS_BASE_URL: http://prometheus.atlas.svc.cluster.local:9090
  GF_SECURITY_ADMIN_USER: atlas
  GF_SECURITY_ADMIN_PASSWORD: replace-me
  GF_USERS_ALLOW_SIGN_UP: "false"
