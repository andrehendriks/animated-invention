apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-frontend
  namespace: atlas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlas-frontend
  template:
    metadata:
      labels:
        app: atlas-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/andrehendriks/animated-invention/frontend:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-temp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-temp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-frontend
  namespace: atlas
spec:
  type: LoadBalancer
  selector:
    app: atlas-frontend
  ports:
    - port: 80
      targetPort: 8080
