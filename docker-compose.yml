services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6

  prometheus:
    build:
      context: ./infrastructure/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${ATLAS_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    build:
      context: ./infrastructure/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${ATLAS_GRAFANA_ADMIN_USER:-atlas}
      GF_SECURITY_ADMIN_PASSWORD: ${ATLAS_GRAFANA_ADMIN_PASSWORD:-change-me-before-exposing}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${ATLAS_GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
    environment:
      ATLAS_APP_NAME: ${ATLAS_APP_NAME:-Project Atlas}
      ATLAS_ENVIRONMENT: ${ATLAS_ENVIRONMENT:-production}
      ATLAS_AUTH_ENABLED: ${ATLAS_AUTH_ENABLED:-false}
      ATLAS_API_KEY: ${ATLAS_API_KEY:-}
      ATLAS_OLLAMA_BASE_URL: ${ATLAS_OLLAMA_BASE_URL:-http://ollama:11434}
      ATLAS_OLLAMA_MODEL: ${ATLAS_OLLAMA_MODEL:-llama3.2}
      ATLAS_ALLOWED_ORIGINS: ${ATLAS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
      ATLAS_DOCKER_ENABLED: ${ATLAS_DOCKER_ENABLED:-true}
      ATLAS_KUBERNETES_ENABLED: ${ATLAS_KUBERNETES_ENABLED:-true}
      ATLAS_SYNOLOGY_ENABLED: ${ATLAS_SYNOLOGY_ENABLED:-false}
      ATLAS_SYNOLOGY_MOUNTS: ${ATLAS_SYNOLOGY_MOUNTS:-}
      ATLAS_MONITORING_ENABLED: ${ATLAS_MONITORING_ENABLED:-true}
      ATLAS_PROMETHEUS_BASE_URL: ${ATLAS_PROMETHEUS_BASE_URL:-http://prometheus:9090}
      ATLAS_GITHUB_ENABLED: ${ATLAS_GITHUB_ENABLED:-false}
      ATLAS_GITHUB_REPOSITORIES: ${ATLAS_GITHUB_REPOSITORIES:-}
      ATLAS_GITHUB_TOKEN: ${ATLAS_GITHUB_TOKEN:-}
      ATLAS_RADIO_ENABLED: ${ATLAS_RADIO_ENABLED:-false}
      ATLAS_ICECAST_STATUS_URL: ${ATLAS_ICECAST_STATUS_URL:-http://icecast:8000/status-json.xsl}
      ATLAS_LIQUIDSOAP_HEALTH_URL: ${ATLAS_LIQUIDSOAP_HEALTH_URL:-}
      ATLAS_BACKUP_ENABLED: ${ATLAS_BACKUP_ENABLED:-false}
      ATLAS_BACKUP_PATH: ${ATLAS_BACKUP_PATH:-/mnt/atlas-backups}
      ATLAS_DATABASE_PATH: ${ATLAS_DATABASE_PATH:-/data/atlas.db}
      ATLAS_HISTORY_MAX_ENTRIES: ${ATLAS_HISTORY_MAX_ENTRIES:-1000}
    ports:
      - "${ATLAS_BACKEND_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KUBECONFIG:-~/.kube/config}:/home/atlas/.kube/config:ro
      - atlas-data:/data
    group_add:
      - "${ATLAS_DOCKER_GID:-0}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready').read()"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    ports:
      - "${ATLAS_FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  ollama-data:
  atlas-data:
  prometheus-data:
  grafana-data:
